# Cache zone for the per-instance liveness check. Install once per host:
#
#   mkdir -p /var/cache/nginx
#   install -m 644 goopy-cache.conf /etc/nginx/conf.d/
#   nginx -t && systemctl reload nginx
#
# The mkdir is not optional. nginx creates only the *final* component of a
# `proxy_cache_path`, never its parents, and the nginx package does not ship
# /var/cache/nginx unless something already caches. Without it `nginx -t` dies
# with `mkdir() "/var/cache/nginx/goopy_alive" failed (2: No such file or
# directory)` — which is the host-wide failure described below, reached through
# the install procedure itself rather than by forgetting it.
#
# WHY THIS EXISTS
#
# Every instance site runs an `auth_request` against gl-serv to decide whether
# the instance is still alive. `auth_request` fires once per *request*, not once
# per page, so a Ghost admin screen — ~45 subresources — asks the same question
# 45 times in a burst. This zone collapses that to about one question per slug
# per few seconds.
#
# WHY IT CANNOT LIVE IN THE SITE FILE
#
# `proxy_cache_path` is only valid in the `http {}` block. The per-site configs
# gl-serv generates are included inside it and cannot declare it, so this is a
# one-time host setup step rather than something provisioning can do for itself.
#
# INSTALL THIS BEFORE DEPLOYING THE TEMPLATE THAT USES IT.
# A site referencing an undeclared zone fails `nginx -t`, and that failure is
# host-wide: nginx refuses to reload at all, so *every* instance stops being
# reconfigurable until the zone exists.
#
# HOW LONG THINGS ARE CACHED
#
# Not decided here. gl-serv sets `Cache-Control` per response — a short
# `max-age` when the instance is alive, `no-store` when it is not — and nginx
# honours it. That keeps expiry and (once #96 lands) the scale-to-zero wake
# path correct: a denial is never remembered, so it always reaches gl-serv.
#
# `inactive=60s` only bounds how long an untouched entry is kept before nginx
# evicts it for space; it does not extend any entry's freshness.

proxy_cache_path /var/cache/nginx/goopy_alive
                 levels=1:2
                 keys_zone=goopy_alive:10m
                 max_size=64m
                 inactive=60s
                 use_temp_path=off;
