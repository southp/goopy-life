# Deployed configuration — dev droplet (api.southp.dev).
#
# This file IS what the droplet runs: deploy/push-binary.sh installs it at
# /opt/goopy-life/config.toml on every deploy. Edit it here, not there — a
# hand-edit on the droplet is silently overwritten by the next deploy.
#
# No secrets belong in this file: it is tracked in git and world-readable on the
# droplet. When gl-serv eventually needs a credential, put it in a root-owned
# EnvironmentFile referenced from deploy/gl-serv.service instead.
#
# Every field here is parsed by gl_core::Config. A field the binary requires but
# this file omits is a startup crash, which is why tests/committed_configs.rs parses
# this file on every CI run.

# Base directory for goopy working directories.
base_dir = "/opt/goopy-life/data"

# Public domain — instances are served at {slug}.{domain}.
domain = "southp.dev"

# How long each goopy lives (days).
life_in_days = 1

# Port range for goopy instances (inclusive).
port_range_start = 40000
port_range_end = 49999

# Dev mode skips systemd, nginx and ZFS in favour of plain dirs and background
# processes. The dev *droplet* is a real deployment, so this stays false — it is
# about how instances are provisioned, not about which environment this is.
dev_mode = false

# Allowed CORS origin: the Vercel frontend.
cors_origin = "https://southp.dev"

# Address and port for gl-serv to bind; also used by nginx auth_request
# subrequests. Note that 0.0.0.0 exposes gl-serv directly alongside nginx; see
# the note in docs/DEPLOYMENT.md before narrowing it to 127.0.0.1.
bind_address = "0.0.0.0:3000"

# How often to sweep expired and Failed instances (seconds; 3600 = 1h).
#
# Matches the shipped default since #117, which also made the first sweep run
# at startup instead of one full interval later. Stated explicitly anyway: the
# interval is the worst-case delay on reclaiming a wedged slot, so it is worth
# being deliberate about on the box that runs at a cap of 10.
sweep_interval_secs = 3600

# Instance caps (#106). max_active is RAM-bound: ~200 MB per Ghost process on a
# 2 GB droplet leaves room for about 10. max_provisioned is disk-bound and is
# kept equal to max_active until scale-to-zero (#96) lands, which means the RAM
# cap is unreachable and a full server answers `server_full`, never
# `server_busy`. Both must be > 0, and max_active <= max_provisioned.
max_active = 10
max_provisioned = 10

[registry]
# Registry database path.
path = "/opt/goopy-life/goopy.db"

[allocator]
# "PlainDir" (plain filesystem) or "Zfs" (ZFS datasets).
kind = "Zfs"
# Storage pool name (Zfs only).
pool = "zpool_ghost"
# Disk quota per instance in MB (Zfs only).
#
# Sized for what a Ghost instance *writes*, not what Ghost weighs: the ~631 MB
# base install is symlinked from source_dir and never counted against the
# dataset. A freshly booted 6.63.0 instance measured 1.4 MB, almost all of it
# content/data/ghost.db — so this number is entirely headroom for uploads
# (content/images, media, files), post content and logs.
#
# The ceiling is the pool, not the instance: zpool_ghost has ~4.35 GB usable and
# max_provisioned is 10, so anything above ~445 MB would overcommit. A ZFS quota
# caps a dataset but reserves nothing, and an overcommitted pool fails worse
# than a quota does — the pool fills and *every* instance starts erroring, rather
# than the one greedy instance hitting its own ceiling. 256 MB keeps all 10
# instances fully backed with room to raise max_provisioned later.
#
# Was 32 MB, which was sized for the Hello provisioner's static page.
quota_mb = 256

[provisioner]
# "Ghost" (real Ghost instances) or "Hello" (PoC page, dev/testing).
kind = "Ghost"
# The prepared base install every instance soft-links against. Version-stamped
# on purpose: the provisioner records this path as written, so a stable symlink
# that later moved would drag every running instance onto a different Ghost on
# its next restart. Upgrading means preparing a new directory and editing these
# two keys together — see docs/GHOST_PROVISIONER.md.
source_dir = "/opt/goopy-life/ghost-6.63.0"
# Stamped onto every instance as service_version. Must name what source_dir
# actually holds; nothing cross-checks them at startup.
version = "6.63.0"
# Absolute path — systemd does not search PATH for ExecStart. Ghost 6.63.0
# requires Node ^22.23.1 || ^24.20.0, which the droplet's nodesource node_22.x
# repo supplies.
node_bin = "/usr/bin/node"
# Unprivileged user each instance's systemd unit runs as.
service_user = "goopy"
