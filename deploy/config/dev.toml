# Deployed configuration — dev host (api.southp.dev).
#
# This file IS what the host runs: deploy/push-binary.sh installs it at
# /opt/goopy-life/config.toml on every deploy. Edit it here, not there — a
# hand-edit on the host is silently overwritten by the next deploy.
#
# No secrets belong in this file: it is tracked in git and world-readable on the
# host. When gl-serv eventually needs a credential, put it in a root-owned
# EnvironmentFile referenced from deploy/config/dev.gl-serv.conf instead.
#
# Every field here is parsed by gl_core::Config. A field the binary requires but
# this file omits is a startup crash, which is why tests/committed_configs.rs parses
# this file on every CI run.

# Base directory for goopy working directories.
base_dir = "/opt/goopy-life/data"

# Public domain — instances are served at {slug}.{domain}.
domain = "southp.dev"

# How long each goopy lives (hours). 8, as in production, so dev behaves
# like it (#110).
life_in_hours = 8

# Port range for goopy instances (inclusive).
port_range_start = 40000
port_range_end = 49999

# Dev mode skips systemd, nginx and ZFS in favour of plain dirs and background
# processes. The dev *host* is a real deployment, so this stays false — it is
# about how instances are provisioned, not about which environment this is.
dev_mode = false

# Allowed CORS origin: the Vercel frontend.
cors_origin = "https://southp.dev"

# Address and port gl-serv listens on. Loopback on purpose (#149): nginx is the
# only thing that should reach gl-serv, and a caller arriving any other way
# bypasses TLS and sets its own X-Real-IP — the header the per-IP rate limiter
# keys on (#21, #105). That does not weaken the limiter, it defeats it: forge a
# fresh IP per request and every bucket, including the tight POST /goopies one,
# becomes unlimited.
bind_address = "127.0.0.1:3000"

# Where nginx connects to reach gl-serv — the auth_request alive-check baked
# into every per-instance site. Deliberately a separate key from bind_address:
# a wildcard is a sensible thing to listen on and a meaningless thing to connect
# to, and until #149 the one string did both jobs. Unset it takes bind_address's
# port on loopback, which is exactly this host's arrangement, so it stays
# commented out. Uncomment only if nginx must reach gl-serv somewhere else.
#   api_address = "127.0.0.1:3000"

# How often to sweep expired and Failed instances (seconds; 900 = 15 min).
#
# Shorter than the shipped 3600 default to suit the 8-hour lifetime (#110),
# the same as production. The interval is the worst-case delay on reclaiming a
# wedged slot, and an hour of it would be up to 12% of an instance's life.
# Since #117 the first sweep also runs at startup.
sweep_interval_secs = 900

# How many days of instance events to keep (#118).
#
# The event log records why a spawn or a teardown failed and when the row was
# reaped, and outlives the instance — which is the point: the ten failures that
# wedged this host in June 2026 left nothing behind once the sweep reaped the
# rows and journald rotated. It is append-only, so the sweep drops anything past
# this window on every run.
#
# 30 days matches the shipped default. Volume is negligible here: only failures
# and reaps are recorded, at a cap of 10 instances.
event_retention_days = 30

# Instance caps (#106), sized from the #113 load experiment measured on this
# host on 2026-09-23 (1 vCPU / 2 GB RAM / 4 GB swap with zswap).
#
# Size the cap from the *serving* ceiling, not the spawn ceiling. They are not
# the same and the gap is large: this box spawns 29 instances happily and
# serves none of them. Past ~22 the swap fills, and at 100% swap every
# instance stops answering HTTP entirely while gl-serv, /capacity and new
# spawns all still look healthy — a cliff, not a slope.
#
#   spawn ceiling   ~= (RAM_mb + swap_mb - 350) / 200   -> 29 here
#   serving ceiling ~= 70% of the spawn ceiling         -> ~22 here
#
# 20 sits below that cliff with margin. Measured cold-touch latency after an
# idle period was 0.14-0.41 s at 18 instances and 0.13-1.42 s at 22.
#
# This depends on the host having 4 GB of swap. On the stock 1 GB the serving
# ceiling is ~10, and that swap is host state no deploy installs (#167) — a
# rebuilt box without it would accept 20 and fail the last ten.
#
# max_provisioned is kept equal to max_active until scale-to-zero (#96) lands,
# which means the RAM cap is unreachable and a full server answers
# `server_full`, never `server_busy`. Both must be > 0, and
# max_active <= max_provisioned.
max_active = 20
max_provisioned = 20

# How many days of daily usage rows `GET /stats` keeps (#172). Only the per-day
# breakdown is windowed; the all-time total is never pruned. The sweep drops
# older days on every run. Must be >= 7, the span of the weekly figure.
#
# 120 rather than the shipped 90: a judgment call, not a measurement. At one
# small row per day, the extra month costs nothing.
stats_retention_days = 120

[registry]
# Registry database path.
path = "/opt/goopy-life/goopy.db"

[allocator]
# "PlainDir" (plain filesystem) or "Zfs" (ZFS datasets).
kind = "Zfs"
# Storage pool name (Zfs only).
pool = "zpool_ghost"
# Disk quota per instance in MB (Zfs only).
#
# Sized for what a Ghost instance *writes*, not what Ghost weighs: the ~631 MB
# base install is symlinked from source_dir and never counted against the
# dataset. A freshly booted 6.63.0 instance measured 1.4 MB, almost all of it
# content/data/ghost.db — so this number is entirely headroom for uploads
# (content/images, media, files), post content and logs.
#
# The ceiling is the pool, not the instance: zpool_ghost has ~4.35 GB usable and
# max_provisioned is 20 against a 4.5 GB pool, so anything above ~225 MB would
# overcommit. A ZFS quota caps a dataset but reserves nothing, and an
# overcommitted pool fails worse than a quota does — the pool fills and *every*
# instance starts erroring, rather than the one greedy instance hitting its own
# ceiling. 200 MB keeps all 20 instances fully backed with headroom.
#
# Generous on purpose: #113 measured real usage at ~120 KB per instance (ZFS
# compression is running at 3.36x), so this bounds abuse rather than sizing
# normal use.
#
# Was 256 MB, which fully backed only 10 instances; before that 32 MB, sized
# for the Hello provisioner's static page.
quota_mb = 200

[provisioner]
# "Ghost" (real Ghost instances) or "Hello" (PoC page, dev/testing).
kind = "Ghost"
# The prepared base install every instance soft-links against. Version-stamped
# on purpose: the provisioner records this path as written, so a stable symlink
# that later moved would drag every running instance onto a different Ghost on
# its next restart. Upgrading means preparing a new directory and editing these
# two keys together — see docs/GHOST_PROVISIONER.md.
source_dir = "/opt/goopy-life/ghost-6.63.0"
# Stamped onto every instance as service_version. Must name what source_dir
# actually holds; nothing cross-checks them at startup.
version = "6.63.0"
# Absolute path — systemd does not search PATH for ExecStart. Ghost 6.63.0
# requires Node ^22.23.1 || ^24.20.0, which the host's nodesource node_22.x
# repo supplies.
node_bin = "/usr/bin/node"
# Unprivileged user each instance's systemd unit runs as.
service_user = "goopy"

# Readiness wait (#151). A spawn stays Spawning until the instance answers
# `GET /` with a 200, because Ghost binds its port immediately and then serves
# its own maintenance page for the whole of first boot — so `Done` used to mean
# "provisioning returned", not "the URL works", and the visitor was handed a
# link ~13s before it served anything. One boot measured ~13s on this host;
# the timeout leaves an order of magnitude of headroom for a host booting
# several at once. An instance that never answers ends Failed, with its port
# released and its working dir reapable by the sweep. The timeout is a real
# ceiling: no single probe is given more time than the wait has left.
ready_timeout_secs = 120
ready_poll_ms = 500
