# systemd drop-in for gl-serv.service — dev droplet.
#
# This file IS what the host runs: deploy/push-binary.sh installs it at
# /etc/systemd/system/gl-serv.service.d/deploy.conf, beside the shared
# deploy/gl-serv.service. Edit it here, not there — a hand-edit on the host is
# overwritten by the next deploy, and any *other* file in that directory is
# reported as drift by deploy/check-host.sh, because a stray override changes
# the unit without appearing in either tracked file.
#
# Only what differs between environments belongs here. Everything identical on
# every host stays in deploy/gl-serv.service, so the two cannot disagree about
# anything but this.
#
# No secrets. This file is tracked in git and world-readable on the host. When
# gl-serv needs a credential, reference a root-owned file from here with
# EnvironmentFile= and create that file by hand; the deploy never ships it.

[Service]
# Log level (#91).
Environment=RUST_LOG=debug
