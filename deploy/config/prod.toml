# Deployed configuration — production.
#
# This file IS what the production host runs: deploy/push-binary.sh installs it
# at /opt/goopy-life/config.toml. Edit it here, not there.
#
# No secrets belong in this file: it is tracked in git and world-readable on the
# host. Credentials go in a root-owned EnvironmentFile referenced from
# deploy/config/prod.gl-serv.conf instead.

# Base directory for goopy working directories.
base_dir = "/opt/goopy-life/data"

# Public domain — instances are served at {slug}.{domain}, the api at
# api.{domain}, and expired instances redirect to https://{domain}/expired.
# deploy/config/prod.api.nginx names this domain too (server_name and the
# certificate under /etc/letsencrypt/live/goopy.life/), and CI fails a PR that
# changes only one of the two.
domain = "goopy.life"

# How long each goopy lives (hours).
#
# 8 rather than 24 (#110): when all 20 slots are full, each turns over three
# times a day instead of once, so a full server serves ~3x the visitors
# (20 x 24/8). Each instance stores its own lifetime, so a change here reaches
# only new instances and is easy to undo.
life_in_hours = 8

# Port range for goopy instances (inclusive).
port_range_start = 40000
port_range_end = 49999

# Dev mode skips systemd, nginx and ZFS in favour of plain dirs and background
# processes. Never true here.
dev_mode = false

# Allowed CORS origin: the Vercel frontend, which lives at https://{domain}.
# gl-core already assumes that address in every instance's expiry redirect
# (`return 302 https://{domain}/expired;`).
cors_origin = "https://goopy.life"

# Address and port gl-serv listens on. Loopback on purpose (#149): nginx is the
# only thing that should reach gl-serv, and a caller arriving any other way
# bypasses TLS and sets its own X-Real-IP — the header the per-IP rate limiter
# keys on (#21, #105). That does not weaken the limiter, it defeats it: forge a
# fresh IP per request and every bucket, including the tight POST /goopies one,
# becomes unlimited.
bind_address = "127.0.0.1:3000"

# Where nginx connects to reach gl-serv — the auth_request alive-check baked
# into every per-instance site. Deliberately a separate key from bind_address:
# a wildcard is a sensible thing to listen on and a meaningless thing to connect
# to, and until #149 the one string did both jobs. Unset it takes bind_address's
# port on loopback, which is exactly this host's arrangement, so it stays
# commented out. Uncomment only if nginx must reach gl-serv somewhere else.
#
# No REVIEW marker on either key: neither names a dev-only value. #147 keeps
# a checkpoint that verifies bind_address is still loopback here, so that
# production cannot quietly inherit the wildcard.
#   api_address = "127.0.0.1:3000"

# How often to sweep expired instances (seconds; 900 = 15 min).
#
# Mirrors dev. Shorter than gl-core's 3600 default because of the 8-hour
# lifetime (#110): the interval is the worst-case delay on reclaiming a capacity
# slot, and at 3600 an expired instance could hold one of 20 slots for nobody
# for up to an hour, 12% of an 8-hour life. It is also the Retry-After a full
# server's 503 sends. A sweep with nothing to reap is cheap.
sweep_interval_secs = 900

# 30, the shipped default, is enough here: long-term counts live in #172's
# /stats, so this log only has to hold recent failure detail.
#
# How many days of instance events to keep (#118). The event log records why a
# spawn or teardown failed and when the row was reaped, and outlives the
# instance. It is append-only; the sweep drops anything past this window.
event_retention_days = 30

# Instance caps. PRECONDITION: these values are only valid on a host with dev's
# spec and system configuration — 1 vCPU / 2 GB RAM, 4 GB of swap, and zswap
# enabled (#147's host checklist, section 3). Check it on the host:
#
#   ssh <prod> 'free -m; cat /proc/swaps; cat /sys/module/zswap/parameters/enabled'
#
# Expect ~4095 MB of total swap and zswap `Y`. On the stock 1 GB swap the
# serving ceiling is ~10, and nothing errors: the box accepts all 20 instances
# and then stops serving every one of them. Swap is host state no deploy
# installs (#167), and nothing else here will catch its absence.
#
# The cap is sized from the *serving* ceiling, never the spawn ceiling. They
# are not the same and the gap is large. From the #113 load experiment measured
# on the dev host on 2026-09-23:
#
#   spawn ceiling   ~= (RAM_mb + swap_mb - 350) / 200
#   serving ceiling ~= 70% of the spawn ceiling        <- size the cap from THIS
#
#   2 GB RAM + 1 GB swap (stock droplet)  -> spawns 14, serves ~10
#   2 GB RAM + 4 GB swap + zswap          -> spawns 29, serves ~22  (dev runs this)
#
# The failure past the serving ceiling is a cliff, not a slope: at 100% swap a
# box spawns instances happily, gl-serv and /capacity stay healthy, and *every*
# instance stops answering HTTP. Sizing from the spawn ceiling ships a server
# that provisions and serves nothing, with no signal pointing at the cause.
#
# Also keep max_provisioned * quota_mb below the ZFS pool size, or the quotas
# overcommit the pool — see the allocator section.
#
# max_provisioned is kept equal to max_active until scale-to-zero (#96) lands,
# which means the RAM cap is unreachable and a full server answers
# `server_full`, never `server_busy`. Both must be > 0, and
# max_active <= max_provisioned.
#
max_active = 20
max_provisioned = 20

# How many days of daily usage rows `GET /stats` keeps (#172). Only the per-day
# breakdown is windowed; the all-time total is never pruned. The sweep drops
# older days on every run. Must be >= 7, the span of the weekly figure.
#
# 120 rather than the shipped 90: a judgment call, not a measurement. At one
# small row per day, the extra month costs nothing.
stats_retention_days = 120

[registry]
# Registry database path.
path = "/opt/goopy-life/goopy.db"

[allocator]
# "PlainDir" (plain filesystem) or "Zfs" (ZFS datasets).
kind = "Zfs"
# The pool name matches dev's: the operator creates production's pool as
# `zpool_ghost` (#147's host checklist), and it must be at least 4 GB — see the
# binding rule below.
#
# The quota was settled by #173 and mirrors dev. #113 measured real usage at
# ~120 KB per instance (ZFS compression running at 3.36x), so this bounds abuse
# rather than sizing normal use. The binding rule is max_provisioned * quota_mb
# <= pool size: an overcommitted pool fills and breaks *every* instance at once,
# which fails worse than one greedy instance hitting its own quota.
# 20 * 200 MB = 4 GB against dev's 4.5 GB pool, so production's pool must be at
# least that.
#
# NOTE: production is public and accountless, where dev is not. This lets any
# anonymous visitor store up to 200 MB for the instance's lifetime. 32 MB was
# the previous value and remains defensible if that is too generous for a
# public beta — the Ghost install itself needs almost none of it.
# Storage pool name (Zfs only).
pool = "zpool_ghost"
# Disk quota per instance in MB (Zfs only).
quota_mb = 200

[provisioner]
# "Ghost" (real Ghost instances) or "Hello" (PoC page, dev/testing).
kind = "Ghost"
# The prepared base install every instance soft-links against — the same path
# as dev, prepared by hand on the host (#147's host checklist). Version-stamped
# on purpose: the provisioner records this path as written, so a stable symlink
# that later moved would drag every running instance onto a different Ghost on
# its next restart. Upgrading means preparing a new directory and editing these
# two keys together — see docs/GHOST_PROVISIONER.md.
source_dir = "/opt/goopy-life/ghost-6.63.0"
# Stamped onto every instance as service_version. Must name what source_dir
# actually holds; nothing cross-checks them at startup.
version = "6.63.0"
# Absolute path — systemd does not search PATH for ExecStart. Ghost 6.63.0
# requires Node ^22.23.1 || ^24.20.0; the host checklist installs 22.23.2.
node_bin = "/usr/bin/node"
# Unprivileged user each instance's systemd unit runs as.
service_user = "goopy"

# Readiness wait (#151). A spawn stays Spawning until the instance answers
# `GET /` with a 200, because Ghost binds its port immediately and then serves
# its own maintenance page for the whole of first boot. An instance that never
# answers ends Failed, with its port released and its working dir reapable by
# the sweep. The timeout is a real ceiling: no single probe is given more time
# than the wait has left.
#
# 120 s, dev's value, is ~10x the ~12 s first boot #113 measured (7.6 s of it
# Ghost's DB migration). That leaves room for several instances booting at
# once, and a boot that never comes up holds a slot for 2 minutes at most.
ready_timeout_secs = 120
ready_poll_ms = 500
