# Deployed configuration — production.
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ PLACEHOLDER. This is a verbatim copy of the dev droplet's configuration,   │
# │ taken so the file exists and parses. There is no production host yet, and  │
# │ the lines marked `REVIEW` below still name dev-only values.                │
# │                                                                            │
# │ Work through every REVIEW marker before the first production deploy.       │
# └───────────────────────────────────────────────────────────────────────────┘
#
# This file IS what the production host runs: deploy/push-binary.sh installs it
# at /opt/goopy-life/config.toml. Edit it here, not there.
#
# No secrets belong in this file: it is tracked in git and world-readable on the
# host. Credentials go in a root-owned EnvironmentFile referenced from
# deploy/config/prod.gl-serv.conf instead.

# Base directory for goopy working directories.
base_dir = "/opt/goopy-life/data"

# REVIEW: production serves goopy.life. deploy/config/prod.api.nginx names this
# domain too, and CI fails a PR that changes only one of the two.
# Public domain — instances are served at {slug}.{domain}.
domain = "southp.dev"

# REVIEW: production instances are likely to want a different lifetime.
# How long each goopy lives (days).
life_in_days = 1

# Port range for goopy instances (inclusive).
port_range_start = 40000
port_range_end = 49999

# Dev mode skips systemd, nginx and ZFS in favour of plain dirs and background
# processes. Never true here.
dev_mode = false

# REVIEW: must match the production frontend origin, not the dev one.
# Allowed CORS origin: the Vercel frontend.
cors_origin = "https://southp.dev"

# Address and port gl-serv listens on. Loopback on purpose (#149): nginx is the
# only thing that should reach gl-serv, and a caller arriving any other way
# bypasses TLS and sets its own X-Real-IP — the header the per-IP rate limiter
# keys on (#21, #105). That does not weaken the limiter, it defeats it: forge a
# fresh IP per request and every bucket, including the tight POST /goopies one,
# becomes unlimited.
bind_address = "127.0.0.1:3000"

# Where nginx connects to reach gl-serv — the auth_request alive-check baked
# into every per-instance site. Deliberately a separate key from bind_address:
# a wildcard is a sensible thing to listen on and a meaningless thing to connect
# to, and until #149 the one string did both jobs. Unset it takes bind_address's
# port on loopback, which is exactly this host's arrangement, so it stays
# commented out. Uncomment only if nginx must reach gl-serv somewhere else.
#
# No REVIEW marker on either key: neither names a dev-only value. #147 keeps
# a checkpoint that verifies bind_address is still loopback here, so that
# production cannot quietly inherit the wildcard.
#   api_address = "127.0.0.1:3000"

# How often to sweep expired instances (seconds; 86400 = 24h).
#
# This deliberately diverges from gl-core's shipped default, which dropped to
# 3600 in #117 — the interval is the worst-case delay on reclaiming a capacity
# slot, so a day meant a full server stayed full for a day. Prod keeps 24h until
# #147 (go live) sizes it against the real droplet; delete this note when it is
# cut over.
sweep_interval_secs = 86400

# REVIEW: 30 days is the shipped default, chosen for a dev droplet where the
# only reader is whoever is debugging that week. Production may want longer —
# a public beta's failure rate is a trend worth seeing over a quarter, and the
# window is also the answer to "how far back can we explain an outage". Size it
# against real volume and disk before the first production deploy rather than
# inheriting dev's number.
#
# How many days of instance events to keep (#118). The event log records why a
# spawn or teardown failed and when the row was reaped, and outlives the
# instance. It is append-only; the sweep drops anything past this window.
event_retention_days = 30

# REVIEW: size these against the production droplet's RAM and disk, which need
# not match the dev box.
# Instance caps (#106). max_active is RAM-bound: ~200 MB per Ghost process on a
# 2 GB droplet leaves room for about 10. max_provisioned is disk-bound and is
# kept equal to max_active until scale-to-zero (#96) lands, which means the RAM
# cap is unreachable and a full server answers `server_full`, never
# `server_busy`. Both must be > 0, and max_active <= max_provisioned.
max_active = 10
max_provisioned = 10

[registry]
# Registry database path.
path = "/opt/goopy-life/goopy.db"

[allocator]
# "PlainDir" (plain filesystem) or "Zfs" (ZFS datasets).
kind = "Zfs"
# REVIEW: the production pool name and a quota sized for real Ghost installs —
# 32 MB is a dev-sized placeholder.
# Storage pool name (Zfs only).
pool = "zpool_ghost"
# Disk quota per instance in MB (Zfs only).
quota_mb = 32

[provisioner]
# REVIEW: production should serve real Ghost instances once #18 lands.
# "Hello" (no-op dev provisioner) or "Ghost" (real Ghost install, #18).
kind = "Hello"

# Readiness wait — Ghost only, so commented out while kind = "Hello" (#151).
# A spawn stays Spawning until the instance answers `GET /` with a 200, because
# Ghost binds its port immediately and then serves its own maintenance page for
# the whole of first boot. An instance that never answers ends Failed, with its
# port released and its working dir reapable by the sweep. The timeout is a real
# ceiling: no single probe is given more time than the wait has left.
# REVIEW: size the timeout against production's boot times, which will be slower
# than a dev droplet's if the host runs several instances at once.
#   ready_timeout_secs = 120   # default
#   ready_poll_ms      = 500   # default
