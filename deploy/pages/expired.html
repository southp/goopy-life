<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goopy expired — Goopy.Life</title>
  <style>
    :root {
      --background: #0a0a0a;
      --foreground: #ededed;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: var(--foreground);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page-wrapper {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      background-color: #000;
    }

    .page-main {
      display: flex;
      min-height: 100vh;
      width: 100%;
      max-width: 48rem;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background-color: #000;
      padding: 2rem;
      text-align: center;
    }

    .hero-emoji {
      font-size: 8rem;
      line-height: 1;
      filter: hue-rotate(180deg) brightness(1.5);
      opacity: 0.85;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
    }

    .expired-heading {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--foreground);
      margin: 0;
    }

    .expired-message {
      font-size: 1rem;
      color: #aaa;
      margin: 0;
      max-width: 28rem;
      line-height: 1.6;
    }

    .go-home-button {
      display: inline-flex;
      height: 3rem;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border-radius: 64px;
      background-color: var(--foreground);
      padding: 0 1.25rem;
      color: var(--background);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition-property: color, background-color, border-color;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      transition-duration: 150ms;
      margin-top: 0.5rem;
    }

    .go-home-button:hover {
      background-color: #ccc;
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <main class="page-main">
      <span class="hero-emoji">&#128169;</span>
      <p class="expired-heading">This goopy has expired.</p>
      <p class="expired-message">
        Ephemeral Ghost instances on Goopy.Life have a limited lifespan.
        This one has run its course. Want a fresh one?
      </p>
      <a class="go-home-button" href="https://goopy.life">Ghost now!</a>
    </main>
  </div>
</body>
</html>
