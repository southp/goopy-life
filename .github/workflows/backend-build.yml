name: Backend build

on:
  push:
    branches: ['trunk']
    paths: ['backend/**', 'deploy/config/**', 'deploy/gl-serv.service']
  pull_request:
    # deploy/config/** and deploy/gl-serv.service are in scope because
    # tests/committed_configs.rs reads those files: a config edit can fail the
    # build just as a code edit can.
    paths: ['backend/**', 'deploy/config/**', 'deploy/gl-serv.service']

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v4
    - name: Install ZFS utilities
      # The runner image ships a stale apt index, so `install` resolves a
      # package version that Ubuntu may already have rotated out of the pool —
      # which fails the whole job with a 404 rather than a build error. Refresh
      # the index first so the request always names a version still published.
      run: |
        sudo apt-get update
        sudo apt-get install -y zfsutils-linux
    - name: Load ZFS kernel module
      run: sudo modprobe zfs
    - name: Create loopback-based test pool
      run: |
        truncate -s 512M /tmp/zfs-test-disk.img
        sudo zpool create testpool /tmp/zfs-test-disk.img
    - name: Install the pinned Rust toolchain
      # Installs exactly what backend/rust-toolchain.toml names, so this job
      # lints with the same clippy as every local build rather than whichever
      # stable the runner image happens to carry.
      run: rustup toolchain install
    - name: Check formatting
      run: cargo fmt --check
    # --locked: build what Cargo.lock says, and fail rather than quietly
    # resolving new versions if it has fallen out of step with the manifests.
    - name: Build
      run: cargo build --locked --verbose
    - name: Run tests (non-ZFS)
      run: cargo test --locked --verbose
    - name: Run ZFS tests (root required)
      run: sudo env "PATH=$PATH" "HOME=$HOME" cargo test --locked -p gl-core --verbose -- --ignored
    - name: Lint
      run: cargo clippy --locked --all-targets -- -D warnings
