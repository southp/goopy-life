name: Frontend build and lint

on:
  push:
    branches: ['trunk']
    paths: ['frontend/**']
  pull_request:
    paths: ['frontend/**']

jobs:
  build-and-lint:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # engines.node in package.json is the one place the Node version is
          # written: Vercel reads the same field, and yarn refuses to install
          # locally on a Node outside it.
          node-version-file: frontend/package.json
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        env:
          # next.config.ts throws at build time if NEXT_PUBLIC_GL_API_URL is unset.
          # lib/config.ts throws if GL_CONFIG_API_URL is unset, but degrades gracefully
          # when the URL is unreachable — so a dummy value is sufficient for CI.
          NEXT_PUBLIC_GL_API_URL: http://localhost:3001
          GL_CONFIG_API_URL: http://localhost:3001
        run: yarn build

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test
