name: Claude Code Review
on:
  pull_request:
    types: [labeled]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false && github.event.label.name == 'needs review'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR Review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are performing a code review. Follow these rules strictly:

            ## Step 1 — Read the full PR context first (mandatory)
            Before writing any comment, run:
            - `gh pr view $PR_NUMBER --repo $REPO` to get the PR description and any linked issues
            - `gh pr diff $PR_NUMBER --repo $REPO` to see all changes
            - `gh pr view $PR_NUMBER --repo $REPO --comments` to read ALL existing comment threads

            ## Step 2 — Respect prior decisions
            Read every existing comment thread carefully. If a pattern, approach, or decision was
            already discussed in a previous round (even informally), do NOT suggest reverting it.
            When commenting on code that was already discussed, acknowledge the existing thread.
            Example: if a previous thread decided to use `tracing::info!` instead of `println!`,
            do not suggest using `println!`.

            ## Step 3 — Skip already-fixed issues
            Check the full commit history (`gh pr view $PR_NUMBER --repo $REPO`) and compare it
            against previous review comments. If an issue raised in a prior review round has been
            addressed in a subsequent commit, do NOT raise it again.
            Only comment on issues that are still present in the current HEAD of the PR branch.

            ## Step 4 — Focus on the latest commits
            If this is a follow-up review round (there are already review comments), identify the
            commits added since the last review comment was posted. Focus your review primarily on
            those new commits. Clearly state at the top of your review which commits you are
            examining.

            ## Step 5 — Verify linked issue claims
            If the PR description says "Closes #N" or "Fixes #N", run:
            - `gh issue view N --repo $REPO` to fetch the issue body and acceptance criteria
            Verify that the current HEAD of the PR actually addresses ALL tasks and acceptance
            criteria in the linked issue. If anything is missing, raise it explicitly.

            ## Review focus areas
            1. **Code Quality** — Clean code, proper error handling, readability
            2. **Security** — Vulnerabilities, input sanitization, auth logic
            3. **Performance** — Bottlenecks, resource leaks
            4. **Testing** — Adequate coverage, missing test scenarios
            5. **Correctness** — Does the implementation match what the issue requires?

            ## Output
            - Post each specific finding as an inline comment.
            - Do NOT post a top-level comment yourself, by any means. The workflow posts your
              final message verbatim as the review summary.
            - Your final message is therefore the summary, in Markdown, and it is mandatory even
              when you have no findings. State which commits you examined, whether the linked
              issue is fully addressed, list the inline findings in order of importance, and
              general observations. If you raised nothing, explain what you checked and why
              nothing needed raising.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh api:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*)"

      # Claude's final message only reaches its (hidden) log, so post it here: every
      # labelled run leaves a comment, including one that found nothing or crashed.
      - name: Post review summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          summary=""
          if [ -f "$EXECUTION_FILE" ]; then
            echo "Tool calls the review was not allowed to make:"
            jq -r '[.[] | select(.type == "result")] | last | .permission_denials // [] | .[]
              | "  \(.tool_name) \(.tool_input.command // "")"' "$EXECUTION_FILE" || true
            summary=$(jq -r '[.[] | select(.type == "result")] | last | .result // empty' "$EXECUTION_FILE" || true)
          fi
          if [ -z "$summary" ]; then
            summary="The review finished without a summary (outcome: \`$REVIEW_OUTCOME\`). See the [run log]($RUN_URL)."
          fi
          printf '%s\n' "$summary" > "$RUNNER_TEMP/review-summary.md"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/review-summary.md"
