<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Site-matching dark backdrop. -->
  <rect width="64" height="64" rx="14" fill="#0a0a0a" />

  <!--
    The hero glyph itself: the same 💩 character as .hero-emoji, under the same
    hue-rotate/brightness filter and white glow (see .hero-emoji in globals.css).
    Rendered with the viewer's emoji font, so the artwork tracks the platform.
  -->
  <text x="32" y="30" font-size="46" text-anchor="middle" dominant-baseline="central"
        opacity="0.85"
        style="filter: hue-rotate(180deg) brightness(1.5) drop-shadow(0 0 3px rgba(255, 255, 255, 0.8))">💩</text>
</svg>
