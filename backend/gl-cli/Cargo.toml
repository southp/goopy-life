[package]
name = "gl-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
url.workspace = true
chrono.workspace = true
gl-core = { path = "../gl-core" }
indicatif = { version = "0.17" }
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# `test-utils` exposes MockSysRunner, so the mode tests can watch what a built
# provisioner would run on teardown without running it.
gl-core = { path = "../gl-core", features = ["test-utils"] }
tempfile = "3"
